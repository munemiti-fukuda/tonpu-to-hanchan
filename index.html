<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🀀</text></svg>">
<title>天鳳 Mortal 東風 → 半荘 牌譜コンバーター</title>
<style>
:root{--bg:#f3f5f2;--panel:#fff;--ink:#17231d;--sub:#5b6a62;--line:#cfd8d2;--acc:#1f6b4a;--accink:#fff;--err:#a3281f;--ok:#1f6b4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--panel:#18251e;--ink:#e6efe9;--sub:#98aaa0;--line:#2c3e34;--acc:#5ec28f;--accink:#08150e;--err:#ff8a7e;--ok:#5ec28f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a15;--panel:#18251e;--ink:#e6efe9;--sub:#98aaa0;--line:#2c3e34;--acc:#5ec28f;--accink:#08150e;--err:#ff8a7e;--ok:#5ec28f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 40px;text-align:center}
h1{font-size:22px;margin:0 0 4px}
p.lead{margin:0 0 18px;color:var(--sub)}
label{display:block;font-weight:600;margin:14px 0 6px}
textarea{width:100%;box-sizing:border-box;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;margin:8px 0}
.row label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400}
[hidden]{display:none!important}
select,input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
button{padding:9px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--accink);font:inherit;font-weight:600;cursor:pointer}
button#go,button#copy{padding:14px 16px;font-size:17px}
button#go{flex:2 1 200px}
button#copy{flex:1 1 140px}
button:disabled{display:none}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{flex:1 1 100%;min-height:1.5em}
.err{color:var(--err)}.ok{color:var(--ok);font-weight:600}
.warn{color:var(--sub);font-size:12px;margin:4px 0 0}
.table{overflow-x:auto}
details{margin:12px 0}summary{cursor:pointer;color:var(--sub);font-size:13px}details:has(#tbl:empty){display:none}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>天鳳 Mortal 東風 → 半荘 牌譜コンバーター</h1>
<p class="lead">天鳳の東風戦牌譜を、Mortalで検討できる半荘形式に変換します。</p>
<div class="row" role="radiogroup" aria-label="変換先"><label><input type="radio" name="mode" id="m4" checked>半荘の南場として出力</label><label><input type="radio" name="mode" id="m0">半荘の東場として出力</label></div>
<textarea id="src" aria-label="天鳳の牌譜リンク" spellcheck="false" style="min-height:72px" placeholder="https://tenhou.net/0/?log=… のような天鳳の牌譜URLを貼る"></textarea>
<div class="row"><button id="go">変換する</button><button id="copy" disabled>結果をコピー</button><span id="msg" role="status"></span></div>
<p class="warn" id="warn">注意：半荘の南場として扱うため、場風の役牌が変わります（東→南、サドンデスでは南→西）。</p>
<textarea id="out" hidden></textarea>
</main>
<script>
var xmlCache=null;
function getOff(){return $("m0").checked?0:4}
var NAMES=["東1局","東2局","東3局","東4局","南1局","南2局","南3局","南4局","西1局","西2局","西3局","西4局"];
var $=function(i){return document.getElementById(i)};
function say(t,c){var m=$("msg");m.textContent=t;m.className=c||"";$("src").style.borderColor=c==="ok"?"var(--ok)":c==="err"?"var(--err)":""}
function label(k){var n=NAMES[k]||("局"+k);return n}
var DAN=["新人","9級","8級","7級","6級","5級","4級","3級","2級","1級","初段","二段","三段","四段","五段","六段","七段","八段","九段","十段","天鳳"];
var RY={yao9:"九種九牌",reach4:"四家立直",ron3:"三家和了",kan4:"四槓散了",kaze4:"四風連打",nm:"流し満貫"};
function tc(t){if(t===16)return 51;if(t===52)return 52;if(t===88)return 53;var y=t>>2,s=(y/9)|0;return s===3?41+y-27:s*10+11+y%9}
function fmt(L,cc,o,f){return f===3?L+cc+o.join(""):f===2?o[0]+L+cc+o.slice(1).join(""):o.join("")+L+cc}
function xmlToJson(x){
  var doc=new DOMParser().parseFromString(x,"text/xml");
  if(doc.getElementsByTagName("parsererror").length){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
  var els=Array.prototype.slice.call(doc.documentElement.children),fi=els.filter(function(e){return e.tagName==="INIT"})[0];
  if(!fi){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
  var off=getOff();
  var ks=[],k=null,nm=["A","B","C","D"],dn=["","","",""],rt=[0,0,0,0],go=0;
  els.forEach(function(e){
    var n=e.tagName,a=function(s){return e.getAttribute(s)};
    if(n==="GO")go=+a("type");
    else if(n==="UN"&&a("n0")&&a("dan")&&a("rate")){nm=[0,1,2,3].map(function(i){return decodeURIComponent(a("n"+i))});dn=a("dan").split(",").map(function(v){return DAN[+v]||""});rt=a("rate").split(",").map(parseFloat)}
    else if(n==="INIT"){var s=a("seed").split(",");
      k={h:[+s[0]+off,+s[1],+s[2]],p:a("ten").split(",").map(function(v){return v*100}),d:[tc(+s[5])],u:[],ld:[null,null,null,null],ri:[0,0,0,0],res:null,ag:[],
        P:[0,1,2,3].map(function(i){return{h:a("hai"+i).split(",").map(Number).sort(function(p,q){return p-q}).map(tc),dr:[],dc:[]}})};ks.push(k)}
    else if(!k){}
    else if(/^[TUVW]\d+$/.test(n)){var p="TUVW".indexOf(n[0]),t=+n.slice(1);k.P[p].dr.push(tc(t));k.ld[p]=t}
    else if(/^[DEFGdefg]\d+$/.test(n)){var p="DEFG".indexOf(n[0].toUpperCase()),t=+n.slice(1),c=k.ld[p]===t?60:tc(t);k.P[p].dc.push(k.ri[p]?"r"+c:c);k.ri[p]=0;k.ld[p]=null}
    else if(n==="REACH"){if(a("step")==="1")k.ri[+a("who")]=1}
    else if(n==="DORA")k.d.push(tc(+a("hai")));
    else if(n==="N"){
      var p=+a("who"),m=+a("m"),f=m&3,P=k.P[p],t,r,ids,cd,un;
      if(m&4){t=m>>10;r=t%3;t=(t/3)|0;t=((t/7)|0)*9+t%7;ids=[t*4+((m>>3)&3),(t+1)*4+((m>>5)&3),(t+2)*4+((m>>7)&3)];cd=ids.splice(r,1)[0];P.dr.push("c"+tc(cd)+ids.map(tc).join(""))}
      else if(m&8){t=m>>9;r=t%3;t=(t/3)|0;un=(m>>5)&3;ids=[0,1,2,3].filter(function(i){return i!==un}).map(function(i){return t*4+i});cd=ids.splice(r,1)[0];P.dr.push(fmt("p",tc(cd),ids.map(tc),f))}
      else if(m&16){t=m>>9;r=t%3;t=(t/3)|0;var ad=t*4+((m>>5)&3);ids=[0,1,2,3].map(function(i){return t*4+i}).filter(function(i){return i!==ad});cd=ids.splice(r,1)[0];P.dc.push(fmt("k",""+tc(ad)+tc(cd),ids.map(tc),f))}
      else{t=m>>8;r=t%4;t=(t/4)|0;ids=[0,1,2,3].map(function(i){return t*4+i});
        if(f===0){P.dc.push(ids.slice(0,3).map(tc).join("")+"a"+tc(ids[3]))}
        else{cd=ids.splice(r,1)[0];P.dr.push(fmt("m",tc(cd),ids.map(tc),f));P.dc.push(0)}}
      k.ld[p]=null}
    else if(n==="AGARI"){
      var ten=a("ten").split(","),sc=a("sc").split(",").map(Number),dl=[0,1,2,3].map(function(i){return sc[i*2+1]*100}),y=(a("yaku")||"").split(",").filter(Boolean).map(Number),han=0,names=[];
      for(var i=0;i<y.length;i+=2){han+=y[i+1];names.push("役"+y[i]+"("+y[i+1]+"飜)")}
      if(a("yakuman"))names=a("yakuman").split(",").map(function(v){return "役満"+v});
      var w=+a("who"),fr=+a("fromWho"),pao=a("paoWho")==null?w:+a("paoWho");
      k.ag.push([dl,[w,fr,pao,(a("yakuman")?"役満":ten[0]+"符"+han+"飜")+ten[1]+"点"].concat(names)]);
      if(a("doraHaiUra")&&!k.u.length)k.u=a("doraHaiUra").split(",").map(function(v){return tc(+v)});
      k.res=[].concat.apply(["和了"],k.ag)}
    else if(n==="RYUUKYOKU"){var sc=a("sc").split(",").map(Number);k.res=[RY[a("type")]||"流局",[0,1,2,3].map(function(i){return sc[i*2+1]*100})]}
  });
  if(ks.some(function(q){return q.h[0]<0||q.h[0]>11})){say("変換できません。変換後に西4局を超える局があります。東風戦の牌譜を貼っているか確認してください。","err");return}
  var log=ks.map(function(q){var r=[q.h,q.p,q.d,q.u];q.P.forEach(function(P){r.push(P.h,P.dr,P.dc)});r.push(q.res||["流局",[0,0,0,0]]);return r});
  $("out").value=JSON.stringify({title:["",""],dan:dn,lobby:0,log:log,name:nm,rate:rt,ratingc:"PF4",rule:{aka:1,aka51:1,aka52:1,aka53:1,disp:"鳳南喰赤"},sx:["M","M","M","M"]});
  $("copy").disabled=false;
  say("✓ 変換成功！「結果をコピー」を押してください。","ok");
}
function fetchLog(id){
  var urls=["https://tenhou.net/3/log/?"+id,"https://tenhou.net/0/log/?"+id],i=0;
  say("牌譜を取得中…");
  (function next(){
    if(i>=urls.length){say("牌譜を取得できませんでした。URLが正しいか確認して、もう一度お試しください。","err");return}
    fetch(urls[i++]).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){
      if(/^\s*<mjloggm/i.test(t)){xmlCache=t.trim();setTimeout(function(){$("go").onclick()},0)}else next();
    }).catch(function(){next()});
  })();
}
$("go").onclick=function(){
  var q=$("src").value.trim(),lm=q.match(/^https?:\/\/tenhou\.net\/\d\/\?(?:.*&)?log=([0-9a-z\-]+)/i);
  if(!xmlCache&&lm&&q.search(/json=/i)<0){fetchLog(lm[1]);return}
  $("out").value="";$("copy").disabled=true;say("");
  var d;
  var x=xmlCache||$("src").value.trim();xmlCache=null;
  if(/^<mjloggm/i.test(x)){try{return xmlToJson(x)}catch(e){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}}
  var raw=x,pre="",post="",isUrl=false;
  if(/^https?:/i.test(raw)){
    var k=raw.search(/json=/i);
    if(k<0){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
    isUrl=true;pre=raw.slice(0,k+5);raw=raw.slice(k+5);
    try{raw=decodeURIComponent(raw)}catch(e){}
    var st=raw.indexOf("{"),dep=0,en=-1,ins=false,esc=false;
    for(var j=st;j>=0&&j<raw.length;j++){var c=raw.charAt(j);
      if(ins){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')ins=false}
      else if(c==='"')ins=true;else if(c==="{")dep++;else if(c==="}"){dep--;if(dep===0){en=j;break}}}
    if(st<0||en<0){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
    post=raw.slice(en+1);raw=raw.slice(st,en+1);
  }
  try{d=JSON.parse(raw)}catch(e){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
  if(!d||!Array.isArray(d.log)||!d.log.length){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
  var first=d.log[0][0][0],off=getOff();
  var warns=[];
  for(var i=0;i<d.log.length;i++){
    var h=d.log[i][0];
    if(!Array.isArray(h)||typeof h[0]!=="number"){say("牌譜として読み取れませんでした。天鳳の牌譜URL（https://tenhou.net/0/?log=… の形）を貼ってください。","err");return}
    var to=h[0]+off;
    if(to<0||to>11){say("変換できません。"+label(h[0])+"が、変換後に西4局を超えます。東風戦の牌譜を貼っているか確認してください。","err");return}
    var pts=d.log[i][1]||[],sum=0;pts.forEach(function(p){sum+=p});
    if(pts.length===4&&sum+(h[2]||0)*1000!==100000)warns.push(label(h[0])+" の持ち点合計が "+(sum+(h[2]||0)*1000)+" 点です。");
    h[0]=to;
  }
  if(d.rule&&typeof d.rule.disp==="string"){
    var s=d.rule.disp;
    if(s.indexOf("東")>=0&&s.indexOf("南")<0)d.rule.disp=s.replace("東","南");
  }
  var js=JSON.stringify(d);
  $("out").value=isUrl?pre+encodeURIComponent(js)+post:js;
  $("copy").disabled=false;
  say("✓ 変換成功！「結果をコピー」を押してください。"+(warns.length?" 注意："+warns.join(" "):""),"ok");
};
function onMode(){$("warn").textContent=$("m0").checked?"注意：半荘の東場として扱うため、点数状況の判断が変わります（特にオーラス）。":"注意：半荘の南場として扱うため、場風の役牌が変わります（東→南、サドンデスでは南→西）。";$("out").value="";$("copy").disabled=true;say("")}
$("m0").onchange=$("m4").onchange=onMode;
$("src").addEventListener("input",function(){$("out").value="";$("copy").disabled=true;say("")});
$("copy").onclick=function(){
  var v=$("out").value;
  function done(){say("コピーしました。","ok")}
  function fb(){var t=document.createElement("textarea");t.value=v;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();var okc=false;try{okc=document.execCommand("copy")}catch(e){}document.body.removeChild(t);if(okc)done();else say("手動でコピーしてください。","err")}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fb);else fb();
};
</script>
</body>
</html>
